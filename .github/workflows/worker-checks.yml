name: Cloudflare Worker checks

on:
  pull_request:
    branches: [main, feature/order-notifications]
  push:
    branches: [fix/cloudflare-static-assets]

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run API tests
        run: npm test

      - name: Validate Worker package without deploying
        run: npm run deploy:dry
